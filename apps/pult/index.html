<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Пульт" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Пульт</title>
    <script>
      // Тема до первой отрисовки, иначе тёмная тема мигает белым. Ключ и значения те же, что у прежнего пульта (pult/app.js):
      // на одном сайте выбор переносится между ними. auto — как в системе.
      (function () {
        var p = "auto", b = null, bg = null;
        try {
          p = localStorage.getItem("pult.theme") || "auto";
          b = localStorage.getItem("pult.brand");
          if (b !== "winchester" && b !== "neutral") b = localStorage.getItem("pult.brand.co");
          bg = localStorage.getItem("pult.chatbg");
        } catch (e) {}
        var dark = p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.setAttribute("data-theme", dark ? "dark" : "light");
        if (b === "winchester") r.setAttribute("data-brand", "winchester");
        r.setAttribute("data-chatbg", bg === "pattern" || bg === "leather" ? bg : "plain");
        r.style.colorScheme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", b === "winchester" ? (dark ? "#210f0f" : "#fbf7f0") : (dark ? "#16191e" : "#ffffff"));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
