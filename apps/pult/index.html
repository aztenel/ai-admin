<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Пульт</title>
    <script>
      // Тема до первой отрисовки, иначе тёмная тема мигает белым. Ключ и значения те же, что у прежнего пульта (pult/app.js):
      // на одном сайте выбор переносится между ними. auto — как в системе.
      (function () {
        var p = "auto";
        try { p = localStorage.getItem("pult.theme") || "auto"; } catch (e) {}
        var dark = p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.setAttribute("data-theme", dark ? "dark" : "light");
        r.style.colorScheme = dark ? "dark" : "light";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", dark ? "#171b21" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
