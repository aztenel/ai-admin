# Вторая, независимая проверка каждого изменения: те же сценарии на заглушках и пробная сборка без публикации.
# Публикует бота не этот файл, а Cloudflare (Workers Builds).
name: checks
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24] # правило проекта: перед выкладкой тесты на Node 20 и 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Сценарии на заглушках (с модулями src/, границами модулей, контрактом маршрутов и золотыми переписками)
        run: node test/smoke.mjs
      - name: Типы (JSDoc, tsc --checkJs) в src/
        if: matrix.node == 24
        run: npx --yes -p typescript@6.0.2 tsc -p jsconfig.json # границы модулей src/ проверяет test/unit/boundaries.test.mjs внутри smoke.mjs
      - name: Пробная сборка без публикации
        if: matrix.node == 24
        run: npx --yes wrangler@latest deploy --dry-run --outdir /tmp/out
