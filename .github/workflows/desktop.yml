# Программа «Пульт» для Windows (Tauri). Собирается на компьютере GitHub с Windows;
# установщики (.exe и .msi) — в артефактах сборки и в разделе Releases репозитория.
name: desktop
on:
  push:
    branches: [main, dev]
    paths: ["desktop/**", "pult/icon-512.png", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - name: Инструменты Tauri
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Значки из значка пульта
        working-directory: desktop
        run: npx tauri icon ../pult/icon-512.png
      - name: Сборка
        working-directory: desktop
        run: npx tauri build
      - name: Пробный запуск на Windows (снимок экрана)
        shell: pwsh
        env:
          PULT_URL: https://dev-ai-admin.azikonps4.workers.dev/demo
          PULT_SELFTEST: "1"
        run: |
          $p = Start-Process -FilePath desktop/src-tauri/target/release/pult.exe -PassThru
          Start-Sleep -Seconds 30
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE/pult-windows.png")
          "process alive: $(-not $p.HasExited)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Снимок в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: pult-windows-screenshot
          path: pult-windows.png
      - name: Установщики в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: pult-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
      - name: Выпуск в Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pult-v0.1.${{ github.run_number }}"
          pre=""; [ "${{ github.ref_name }}" = "main" ] || pre="--prerelease"
          gh release create "$tag" desktop/src-tauri/target/release/bundle/nsis/*.exe desktop/src-tauri/target/release/bundle/msi/*.msi \
            --target "${{ github.sha }}" --title "Пульт для Windows — сборка ${{ github.run_number }} (${{ github.ref_name }})" $pre \
            --notes "Установщик программы «Пульт» для Windows. Скачайте файл .exe и запустите. Если Windows покажет «Windows защитила ваш компьютер» — нажмите «Подробнее» → «Выполнить в любом случае» (у программы пока нет платной цифровой подписи)."
